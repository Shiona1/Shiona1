  @keyframes pulseSoft { 0%,100%{opacity:.55} 50%{opacity:.95} }
  .seg { animation: draw 1.15s cubic-bezier(.25,.8,.3,1); }
  .lg { animation: fadeIn .8s ease-out; }
  .core { animation: pulseSoft 6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }
  text{font-family:'Segoe UI',Inter,-apple-system,system-ui,sans-serif}

      .blob1{animation:driftA 24s ease-in-out infinite alternate}
      .blob2{animation:driftB 30s ease-in-out infinite alternate}
      .blob3{animation:driftA 27s ease-in-out infinite alternate-reverse}
      @keyframes driftA { to { transform: translate(18px,-14px) scale(1.07) } }
      @keyframes driftB { to { transform: translate(-16px,12px) scale(1.05) } }
    </style>
